<h1>07_操作处置和储存</h1>
<div style="margin-left: 15px;">
 <div class="maincondetail">
  <p>
  </p>
  <p class="mdp0">
   操作注意事项
  </p>
 </div>
 <div class="maincondetail">
  <p>
   1
						.
						在通风良好处进行操作。
  </p>
  <p>
   2
						.
						穿戴合适的个人防护用具。
  </p>
  <p>
   3
						.
						避免接触皮肤和进入眼睛。
  </p>
  <p>
   4
						.
						远离热源、火花、明火和热表面。
  </p>
 </div>
 <div class="maincondetail">
  <p>
  </p>
  <p class="mdp0">
   储存注意事项
  </p>
 </div>
 <div class="maincondetail">
  <p>
   1
						.
						保持容器密闭。
  </p>
  <p>
   2
						.
						储存在干燥、阴凉和通风处。
  </p>
  <p>
   3
						.
						远离热源、火花、明火和热表面。
  </p>
  <p>
   4
						.
						存储于远离不相容材料和食品容器的地方。
  </p>
  <p>
   5
						.
						储存温度一般不应高于30℃，相对湿度一般不应高于80%。
  </p>
