        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
        
        // PDF查看器状态
        // 当前化学品信息（用于PDF搜索）
        let currentChemicalInfo = {
            cas: '',
            name: '',
            aliases: ''
        };

        let pdfDoc = null;
        let currentPageNum = 1;
        let totalPagesCount = 0;
        let currentScale = 1.5;
        let isRendering = false;
        let currentSearchKeyword = ''; // 当前搜索的关键词，用于翻页时保持高亮
        let searchResults = []; // 存储所有搜索结果 [{pageNum, context, keyword, type}]
        
        // PDF文本内容缓存（性能优化：避免重复加载）
        // 结构：Map<pdfFileName, Map<pageNum, pageText>>
        let pdfTextCache = new Map();
        let currentPdfFileName = ''; // 记录当前打开的PDF文件名
        
        // 打开PDF查看器并搜索当前化学品（包括CAS号、名称、别名）
        async function openPdfViewerWithSearch(pdfFileName, title = '法规文件') {
            // 构建分组的搜索关键词对象
            const keywordGroups = {
                cas: currentChemicalInfo.cas || '',
                name: currentChemicalInfo.name || '',
                aliases: []
            };
            
            if (currentChemicalInfo.aliases) {
                // 别名可能是多个，用逗号、分号或顿号分隔
                keywordGroups.aliases = currentChemicalInfo.aliases
                    .split(/[,，;；、\s]+/)
                    .filter(a => {
                        const trimmed = a.trim();
                        // 过滤空字符串和"-"（表示无别名）
                        return trimmed && trimmed !== '-';
                    });
            }
            
            // 调用PDF查看器，传入分组的关键词对象
            await openPdfViewer(pdfFileName, 1, title, keywordGroups);
        }
        
        // 打开PDF文件（支持自动搜索化学品）
        async function openPdfViewer(pdfFileName, pageNumber = 1, title = '法规文件', searchKeyword = '') {
            try {
                showNotification('正在加载PDF文件...', 'info');
                
                const pdfPath = `/pdf/${pdfFileName}`;
                
                // 记录当前PDF文件名（用于缓存）
                currentPdfFileName = pdfFileName;
                
                // 加载PDF（配置CMap支持中文）
                const loadingTask = pdfjsLib.getDocument({
                    url: pdfPath,
                    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
                    cMapPacked: true
                });
                pdfDoc = await loadingTask.promise;
                totalPagesCount = pdfDoc.numPages;
                
                // 保存搜索关键词供翻页和缩放使用
                currentSearchKeyword = searchKeyword;
                
                // 更新标题和页码信息
                document.getElementById('pdfViewerTitle').textContent = title;
                document.getElementById('totalPages').textContent = totalPagesCount;
                
                // 始终显示第1页，不自动跳转
                currentPageNum = 1;
                await renderPage(currentPageNum);  // 移除了 currentSearchKeyword 参数，不需要高亮
                
                // 立即显示查看器（优化：不等待搜索完成）
                document.getElementById('pdfViewerOverlay').classList.add('show');
                showNotification('PDF加载成功', 'success');
                
                // 如果提供了搜索关键词，在后台异步执行搜索（不阻塞PDF显示）
                if (searchKeyword) {
                    setTimeout(async () => {
                        await searchInPdf(searchKeyword);
                    }, 50);  // 减少延迟，更快开始搜索
                }
                
            } catch (error) {
                console.error('PDF加载失败:', error);
                showNotification('PDF加载失败：' + error.message, 'error');
            }
        }

        // 获取页面文本内容（带缓存）
        async function getPageText(pageNum) {
            // 检查缓存
            if (!pdfTextCache.has(currentPdfFileName)) {
                pdfTextCache.set(currentPdfFileName, new Map());
            }
            
            const pageCache = pdfTextCache.get(currentPdfFileName);
            
            // 如果缓存中有，直接返回
            if (pageCache.has(pageNum)) {
                return pageCache.get(pageNum);
            }
            
            // 否则，加载页面文本并缓存
            const page = await pdfDoc.getPage(pageNum);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join('');
            
            // 存入缓存
            pageCache.set(pageNum, pageText);
            
            return pageText;
        }
        
        // 搜索单个页面的关键词（辅助函数）
        // matchType: 'exact' 全字匹配, 'contains' 包含匹配（默认）
        async function searchPageForKeywords(pageNum, keywordList, keywordType = 'CAS号') {
            try {
                // 使用缓存获取页面文本（性能优化）
                const pageText = await getPageText(pageNum);
                
                let foundInThisPage = false;
                
                // 对每个关键词进行搜索
                for (const keywordInfo of keywordList) {
                    const keyword = keywordInfo.keyword;
                    const matchType = keywordInfo.matchType || 'contains';
                    
                    // 查找所有匹配位置
                    let startIndex = 0;
                    while (true) {
                        const index = pageText.indexOf(keyword, startIndex);
                        if (index === -1) break;
                        
                        // 如果是全字匹配，检查前后字符（严格边界判断）
                        if (matchType === 'exact') {
                            const beforeChar = index > 0 ? pageText[index - 1] : '';
                            const afterChar = index + keyword.length < pageText.length 
                                ? pageText[index + keyword.length] 
                                : '';
                            
                            // 检查前后是否为汉字、连字符、括号或英文字母
                            // 汉字：\u4e00-\u9fff（但"特"字除外）
                            // 连字符：-
                            // 括号：()[]
                            // 英文字母：a-zA-Z
                            // 允许的边界字符："特"
                            const invalidBefore = beforeChar && beforeChar !== '特' && /[\u4e00-\u9fff\-\(\)\[\]a-zA-Z]/.test(beforeChar);
                            const invalidAfter = afterChar && afterChar !== '特' && /[\u4e00-\u9fff\-\(\)\[\]a-zA-Z]/.test(afterChar);
                            
                            if (invalidBefore || invalidAfter) {
                                startIndex = index + 1;
                                continue; // 前后有非法字符，不匹配，跳过
                            }
                        }
                        
                        foundInThisPage = true;
                        
                        // 提取上下文（前后各30个字符）
                        const contextStart = Math.max(0, index - 30);
                        const contextEnd = Math.min(pageText.length, index + keyword.length + 30);
                        let context = pageText.substring(contextStart, contextEnd);
                        
                        // 添加省略号
                        if (contextStart > 0) context = '...' + context;
                        if (contextEnd < pageText.length) context = context + '...';
                        
                        // 保存搜索结果
                        searchResults.push({
                            pageNum: pageNum,
                            context: context,
                            keyword: keyword,
                            type: keywordType,  // 标记类型：CAS号、化学品名称、别名
                            index: index
                        });
                        
                        startIndex = index + keyword.length;
                    }
                }
                
                return foundInThisPage;
            } catch (error) {
                console.error(`搜索第${pageNum}页时出错:`, error);
                return false;
            }
        }

        // 在PDF中搜索关键词（按优先级分组搜索：CAS号 -> 名称 -> 别名）
        async function searchInPdf(keywords) {
            if (!pdfDoc || !keywords) return 0;
            
            searchResults = []; // 清空之前的搜索结果
            let firstPage = 0;
            
            // 配置参数
            const QUICK_SEARCH_PAGES = 200;  // 快速搜索前200页
            // 不限制搜索结果数量，搜索全部匹配项
            
            // 构建搜索队列：按优先级排列（CAS号 -> 名称 -> 别名）
            const searchQueue = [];
            
            if (typeof keywords === 'object' && !Array.isArray(keywords)) {
                // 新格式：{cas, name, aliases}
                // 1. CAS号（包含匹配即可）
                if (keywords.cas && keywords.cas.trim()) {
                    searchQueue.push({
                        keyword: keywords.cas.trim(),
                        matchType: 'contains',
                        type: 'CAS号'
                    });
                }
                
                // 2. 化学品名称（全字匹配）
                if (keywords.name && keywords.name.trim()) {
                    searchQueue.push({
                        keyword: keywords.name.trim(),
                        matchType: 'exact',
                        type: '化学品名称'
                    });
                }
                
                // 3. 别名（全字匹配）
                if (keywords.aliases && keywords.aliases.length > 0) {
                    keywords.aliases.forEach(alias => {
                        if (alias && alias.trim()) {
                            searchQueue.push({
                                keyword: alias.trim(),
                                matchType: 'exact',
                                type: '别名'
                            });
                        }
                    });
                }
            } else {
                // 兼容旧格式：字符串或数组
                const keywordArray = Array.isArray(keywords) ? keywords : [keywords];
                keywordArray.filter(k => k && k.trim()).forEach(k => {
                    searchQueue.push({
                        keyword: k.trim(),
                        matchType: 'contains',
                        type: '关键词'
                    });
                });
            }
            
            if (searchQueue.length === 0) return 0;
            
            try {
                // 检查是否已有缓存
                const hasCache = pdfTextCache.has(currentPdfFileName) && 
                                 pdfTextCache.get(currentPdfFileName).size > 0;
                
                // 显示搜索中的持久通知
                const cacheInfo = hasCache ? '使用缓存加速' : '首次加载需缓存文本';
                const searchingNotif = showNotification(
                    `正在搜索 ${totalPagesCount} 页PDF文档... ${cacheInfo}`, 
                    'info', 
                    0
                );
                
                // 批量并行搜索配置
                const BATCH_SIZE = hasCache ? 100 : 50; // 有缓存时可以更大批次
                let searchedPages = 0;
                
                // 按优先级搜索
                for (const group of ['CAS号', '化学品名称', '别名', '关键词']) {
                    const groupKeywords = searchQueue.filter(k => k.type === group);
                    if (groupKeywords.length === 0) continue;
                    
                    // 分批并行处理
                    for (let startPage = 1; startPage <= totalPagesCount; startPage += BATCH_SIZE) {
                        const endPage = Math.min(startPage + BATCH_SIZE - 1, totalPagesCount);
                        
                        // 创建并行任务数组
                        const tasks = [];
                        for (let pageNum = startPage; pageNum <= endPage; pageNum++) {
                            tasks.push(searchPageForKeywords(pageNum, groupKeywords, group));
                        }
                        
                        // 并行执行这一批搜索
                        await Promise.all(tasks);
                        
                        // 更新进度
                        searchedPages = endPage;
                        if (searchingNotif && searchingNotif.textContent) {
                            const progress = Math.round((searchedPages / totalPagesCount) * 100);
                            const cacheStatus = hasCache ? '缓存加速中' : '缓存中';
                            searchingNotif.textContent = `搜索进度：${searchedPages}/${totalPagesCount} 页 (${progress}%) ${cacheStatus}`;
                        }
                        
                        // 记录第一个匹配页
                        if (firstPage === 0 && searchResults.length > 0) {
                            firstPage = searchResults[0].pageNum;
                        }
                    }
                }
                
                // 移除搜索中的通知
                if (searchingNotif) {
                    searchingNotif.classList.add('removing');
                    setTimeout(() => searchingNotif.remove(), 300);
                }
                
                // 所有搜索完成，显示结果
                if (searchResults.length > 0) {
                    renderSearchResults();
                    showNotification(`搜索完成！共找到 ${searchResults.length} 处匹配，点击结果可跳转`, 'success');
                } else {
                    showNotification('未找到匹配项', 'warning');
                }
                
                // 不自动跳转，返回0
                return 0;
                
            } catch (error) {
                console.error('搜索失败:', error);
                showNotification('搜索失败: ' + error.message, 'error');
                return 0;
            }
        }

        // 渲染搜索结果到侧边栏（分组显示，可展开收起）
        function renderSearchResults() {
            try {
                const sidebar = document.getElementById('pdfSidebar');
                const content = document.getElementById('pdfSidebarContent');
                const countSpan = document.getElementById('resultCount');
                
                countSpan.textContent = searchResults.length;
                
                if (searchResults.length === 0) {
                    content.innerHTML = '<div class="no-results">暂无搜索结果</div>';
                    return;
                }
                
                // 按类型分组（保存原始索引）
                const groupedResults = {
                    'CAS号': [],
                    '化学品名称': [],
                    '别名': [],
                    '关键词': []
                };
                
                searchResults.forEach((result, originalIndex) => {
                    const type = result.type || '关键词';
                    if (groupedResults[type]) {
                        groupedResults[type].push({
                            ...result,
                            originalIndex: originalIndex  // 保存原始索引
                        });
                    }
                });
                
                // 清空内容
                content.innerHTML = '';
                
                // 按优先级顺序显示各组结果（使用DOM操作而不是字符串拼接）
                for (const [groupType, results] of Object.entries(groupedResults)) {
                    if (results.length === 0) continue;
                    
                    const groupId = `group-${groupType.replace(/\s+/g, '-')}`;
                    
                    // 创建分组标题
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'search-group-title';
                    titleDiv.id = `title-${groupId}`;
                    titleDiv.onclick = () => toggleSearchGroup(groupId);
                    titleDiv.innerHTML = `
                        <span class="group-icon">${getGroupIcon(groupType)}</span>
                        <span class="group-name">${groupType}</span>
                        <span class="group-count">${results.length}</span>
                        <span class="group-toggle">▼</span>
                    `;
                    content.appendChild(titleDiv);
                    
                    // 创建分组内容容器
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'search-group-content';
                    contentDiv.id = `content-${groupId}`;
                    
                    // 显示该组的所有结果
                    results.forEach((result) => {
                        // 安全地转义和高亮关键词
                        let highlightedContext = result.context || '';
                        if (result.keyword) {
                            const escapedKeyword = escapeRegExp(result.keyword);
                            highlightedContext = highlightedContext.replace(
                                new RegExp(escapedKeyword, 'g'),
                                `<span class="search-result-keyword">${result.keyword}</span>`
                            );
                        }
                        
                        const isActive = result.pageNum === currentPageNum ? 'active' : '';
                        
                        const itemDiv = document.createElement('div');
                        itemDiv.className = `search-result-item ${isActive}`;
                        itemDiv.onclick = () => jumpToSearchResult(result.originalIndex);
                        itemDiv.setAttribute('data-page', result.pageNum);
                        itemDiv.setAttribute('data-original-index', result.originalIndex);
                        itemDiv.innerHTML = `
                            <div class="search-result-page"><i class="fas fa-file-alt"></i> 第 ${result.pageNum} 页</div>
                            <div class="search-result-context">${highlightedContext}</div>
                        `;
                        contentDiv.appendChild(itemDiv);
                    });
                    
                    content.appendChild(contentDiv);
                }
                
                // 自动显示侧边栏
                setTimeout(() => {
                    sidebar.classList.add('show');
                }, 500);
                
            } catch (error) {
                console.error('渲染搜索结果时发生错误:', error);
                showNotification('显示搜索结果时出错: ' + error.message, 'error');
            }
        }
        
        // 切换搜索分组的展开/收起状态
        function toggleSearchGroup(groupId) {
            const titleElement = document.getElementById(`title-${groupId}`);
            const contentElement = document.getElementById(`content-${groupId}`);
            
            if (titleElement && contentElement) {
                titleElement.classList.toggle('collapsed');
                contentElement.classList.toggle('collapsed');
            }
        }
        
        // 获取分组图标
        function getGroupIcon(groupType) {
            const icons = {
                'CAS号': '<i class="fas fa-hashtag"></i>',
                '化学品名称': '<i class="fas fa-flask"></i>',
                '别名': '<i class="fas fa-tags"></i>',
                '关键词': '<i class="fas fa-search"></i>'
            };
            return icons[groupType] || '<i class="fas fa-search"></i>';
        }

        // 跳转到指定搜索结果
        async function jumpToSearchResult(index) {
            if (index < 0 || index >= searchResults.length) return;
            
            const result = searchResults[index];
            currentPageNum = result.pageNum;
            await renderPage(currentPageNum);
            
            // 更新侧边栏中的活动项（根据 data-original-index 匹配）
            const items = document.querySelectorAll('.search-result-item');
            items.forEach((item) => {
                const itemOriginalIndex = parseInt(item.getAttribute('data-original-index'));
                if (itemOriginalIndex === index) {
                    item.classList.add('active');
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // 切换PDF侧边栏显示/隐藏
        function togglePdfSidebar() {
            const sidebar = document.getElementById('pdfSidebar');
            sidebar.classList.toggle('show');
        }

        // 转义正则表达式特殊字符
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }
        
        // 渲染PDF页面（优化版：只渲染Canvas，不渲染文本图层）
        async function renderPage(pageNum) {
            if (isRendering || !pdfDoc) return;
            
            isRendering = true;
            
            try {
                const page = await pdfDoc.getPage(pageNum);
                const canvas = document.getElementById('pdfCanvas');
                const context = canvas.getContext('2d');
                
                const viewport = page.getViewport({ scale: currentScale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                // 渲染PDF页面到canvas
                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                
                await page.render(renderContext).promise;
                
                // 优化：不再渲染文本图层到DOM（已删除高亮功能，不需要DOM文本层）
                // 搜索时直接使用 page.getTextContent() 即可，不需要文本图层
                
                // 更新页码显示
                document.getElementById('currentPage').textContent = pageNum;
                
                // 更新按钮状态
                document.getElementById('prevBtn').disabled = (pageNum <= 1);
                document.getElementById('nextBtn').disabled = (pageNum >= totalPagesCount);
                
                // 更新侧边栏中的活动项
                updateSidebarActiveItem(pageNum);
                
            } catch (error) {
                console.error('页面渲染失败:', error);
                showNotification('页面渲染失败', 'error');
            } finally {
                isRendering = false;
            }
        }

        // 更新侧边栏中的活动项
        function updateSidebarActiveItem(pageNum) {
            const items = document.querySelectorAll('.search-result-item');
            items.forEach(item => {
                const itemPage = parseInt(item.getAttribute('data-page'));
                if (itemPage === pageNum) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // 渲染文本图层并高亮关键词
        async function renderTextLayer(page, viewport, highlightKeyword = '') {
            const textLayerDiv = document.getElementById('textLayer');
            textLayerDiv.innerHTML = ''; // 清空旧内容
            
            // 设置文本图层尺寸和缩放因子
            textLayerDiv.style.width = viewport.width + 'px';
            textLayerDiv.style.height = viewport.height + 'px';
            textLayerDiv.style.setProperty('--scale-factor', viewport.scale);
            
            try {
                // 获取文本内容
                const textContentSource = page.streamTextContent();
                
                // 使用PDF.js的renderTextLayer渲染文本（使用新API）
                const textLayer = pdfjsLib.renderTextLayer({
                    textContentSource: textContentSource,
                    container: textLayerDiv,
                    viewport: viewport
                });
                
                await textLayer.promise;
                
            } catch (error) {
                console.error('文本图层渲染失败:', error);
            }
        }
        
        // 上一页
        async function previousPage() {
            if (currentPageNum <= 1) return;
            currentPageNum--;
            await renderPage(currentPageNum);
        }
        
        // 下一页
        async function nextPage() {
            if (currentPageNum >= totalPagesCount) return;
            currentPageNum++;
            await renderPage(currentPageNum);
        }
        
        // 放大
        async function zoomIn() {
            currentScale += 0.25;
            if (currentScale > 3.0) currentScale = 3.0;
            await renderPage(currentPageNum);
        }
        
        // 缩小
        async function zoomOut() {
            currentScale -= 0.25;
            if (currentScale < 0.5) currentScale = 0.5;
            await renderPage(currentPageNum);
        }
        
        // 关闭PDF查看器
        function closePdfViewer() {
            document.getElementById('pdfViewerOverlay').classList.remove('show');
            pdfDoc = null;
            currentPageNum = 1;
            totalPagesCount = 0;
            currentScale = 1.5;
            currentSearchKeyword = ''; // 清除搜索关键词
            searchResults = []; // 清空搜索结果
            
            // 关闭并清空侧边栏
            const sidebar = document.getElementById('pdfSidebar');
            sidebar.classList.remove('show');
            document.getElementById('pdfSidebarContent').innerHTML = '<div class="no-results">暂无搜索结果</div>';
            document.getElementById('resultCount').textContent = '0';
        }
        
        // ESC键关闭PDF查看器
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const pdfViewer = document.getElementById('pdfViewerOverlay');
                if (pdfViewer.classList.contains('show')) {
                    closePdfViewer();
                }
            }
        });
        
        // 页面加载时聚焦搜索框
        window.onload = function() {
            document.getElementById('searchInput').focus();
        };
    </script>
</body>
