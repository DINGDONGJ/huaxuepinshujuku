<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>危化品数据库查询系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .search-input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-guide {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 12px 25px;
            font-size: 15px;
        }

        .btn-guide:hover {
            background: #667eea;
            color: white;
        }

        .guide-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .guide-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }

        .guide-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }

        .guide-button .title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .guide-button .count {
            font-size: 14px;
            opacity: 0.9;
        }

        .results-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: none;
        }

        .results-container.show {
            display: block;
        }

        .result-section {
            margin-bottom: 30px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 20px;
        }

        .result-section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .info-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .info-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .data-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #667eea;
        }

        .data-table tr:hover {
            background: #f8f9fa;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #c33;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #3c3;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .loading::after {
            content: '...';
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 5px;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .json-data {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 危化品数据库查询系统</h1>
            <p>输入化学品名称或CAS号，查询管理要求、使用规程、应急措施等信息</p>
        </div>

        <div class="search-box">
            <div class="search-input-group">
                <input type="text" 
                       id="searchInput" 
                       class="search-input" 
                       placeholder="请输入化学品名称或CAS号，例如：甲醛、乙醇、50-00-0、酒精"
                       autocomplete="off">
                <button class="btn btn-primary" onclick="searchChemical()">🔍 查询</button>
            </div>

            <div id="guideButtons" class="guide-buttons" style="display: none;"></div>
        </div>

        <div id="resultsContainer" class="results-container"></div>
    </div>

    <script>
        // 搜索框回车事件
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchChemical();
            }
        });

        // 主查询函数 - 显示引导词卡片和完整数据
        async function searchChemical() {
            const name = document.getElementById('searchInput').value.trim();
            if (!name) {
                alert('请输入化学品名称或CAS号');
                return;
            }

            // 显示引导词加载状态
            const guideDiv = document.getElementById('guideButtons');
            guideDiv.innerHTML = '<div class="loading">正在加载</div>';
            guideDiv.style.display = 'grid';

            // 显示数据加载状态
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '<div class="loading">正在查询数据</div>';
            container.classList.add('show');

            try {
                // 并发请求引导词和完整数据
                const [guideResponse, searchResponse] = await Promise.all([
                    fetch('/api/guide', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({name: name})
                    }),
                    fetch('/api/search', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({name: name})
                    })
                ]);

                const guideData = await guideResponse.json();
                const searchData = await searchResponse.json();

                // 显示引导词按钮
                if (guideResponse.ok) {
                    displayGuideButtons(guideData.guides, name);
                } else {
                    guideDiv.innerHTML = `<div class="error-message">${guideData.error || '查询失败'}</div>`;
                }

                // 显示完整查询结果
                if (searchResponse.ok) {
                    displayFullResults(searchData);
                } else {
                    container.innerHTML = `<div class="error-message">❌ ${searchData.error || '查询失败'}</div>`;
                }
            } catch (error) {
                guideDiv.innerHTML = `<div class="error-message">网络错误: ${error.message}</div>`;
                container.innerHTML = `<div class="error-message">❌ 网络错误: ${error.message}</div>`;
            }
        }

        // 显示引导词按钮
        function displayGuideButtons(guides, chemicalName) {
            const guideDiv = document.getElementById('guideButtons');
            guideDiv.innerHTML = '';

            guides.forEach(guide => {
                const button = document.createElement('button');
                button.className = 'guide-button';
                button.innerHTML = `
                    <div class="title">${guide.类别}</div>
                    <div class="count">${guide.描述} (${guide.数据条数}条)</div>
                `;
                button.onclick = () => searchByCategory(chemicalName, guide.类别键);
                guideDiv.appendChild(button);
            });
        }

        // 按类别查询
        async function searchByCategory(name, category) {
            // 保持引导按钮显示，方便用户切换类别
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '<div class="loading">正在查询</div>';
            container.classList.add('show');

            try {
                const response = await fetch('/api/category', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: name, category: category})
                });

                const result = await response.json();

                if (response.ok) {
                    displayCategoryResults(result.data, category, name);
                } else {
                    container.innerHTML = `<div class="error-message">${result.error || '查询失败'}</div>`;
                }
            } catch (error) {
                container.innerHTML = `<div class="error-message">网络错误: ${error.message}</div>`;
            }
        }

        // 返回完整视图
        async function backToFullView(name) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '<div class="loading">正在加载</div>';
            
            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: name})
                });

                const data = await response.json();

                if (response.ok) {
                    displayFullResults(data);
                } else {
                    container.innerHTML = `<div class="error-message">❌ ${data.error || '查询失败'}</div>`;
                }
            } catch (error) {
                container.innerHTML = `<div class="error-message">❌ 网络错误: ${error.message}</div>`;
            }
        }

        // 显示完整查询结果
        function displayFullResults(data) {
            const container = document.getElementById('resultsContainer');
            let html = '';

            // 基本信息
            if (data.basic_info) {
                html += `
                    <div class="result-section">
                        <h2 class="section-title">基本信息</h2>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">CAS号</div>
                                <div class="info-value">${data.basic_info.CAS号}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">中文名</div>
                                <div class="info-value">${data.basic_info.中文名}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">英文名</div>
                                <div class="info-value">${data.basic_info.英文名 || '-'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">分子式</div>
                                <div class="info-value">${data.basic_info.分子式 || '-'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">EC编号</div>
                                <div class="info-value">${data.basic_info.EC编号 || '-'}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // 管理要求
            if (data.management && data.management.length > 0) {
                html += `
                    <div class="result-section">
                        <h2 class="section-title">📜 管理要求</h2>
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>文档类型</th>
                                    <th>法规名称</th>
                                    <th>条款编号</th>
                                    <th>条款标题</th>
                                    <th>相关度</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.management.map(item => `
                                    <tr>
                                        <td><span class="badge badge-info">${item.文档类型}</span></td>
                                        <td>${item.法规名称}</td>
                                        <td>${item.条款编号 || '-'}</td>
                                        <td>${item.条款标题 || '-'}</td>
                                        <td>${item.相关度评分 || '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            // 使用要求
            if (data.sop && data.sop.length > 0) {
                html += `
                    <div class="result-section">
                        <h2 class="section-title">⚠️ 使用要求（操作规程）</h2>
                        ${renderSOP(data.sop)}
                    </div>
                `;
            }

            // GHS分类
            if (data.ghs && data.ghs.length > 0) {
                html += `
                    <div class="result-section">
                        <h2 class="section-title">🔶 GHS分类</h2>
                        ${renderGHS(data.ghs)}
                    </div>
                `;
            }

            // 运输分类
            if (data.transport && data.transport.length > 0) {
                html += `
                    <div class="result-section">
                        <h2 class="section-title">🚛 运输分类</h2>
                        ${renderTransport(data.transport)}
                    </div>
                `;
            }

            // 应急措施
            if (data.emergency && data.emergency.length > 0) {
                html += `
                    <div class="result-section">
                        <h2 class="section-title">🚨 应急措施</h2>
                        ${renderEmergency(data.emergency)}
                    </div>
                `;
            }

            // 别名
            if (data.aliases && data.aliases.所有别名) {
                html += `
                    <div class="result-section">
                        <h2 class="section-title">🏷️ 别名</h2>
                        <div class="info-value">${data.aliases.所有别名}</div>
                    </div>
                `;
            }

            // MSDS章节（16个部分）
            if (data.msds && data.msds.length > 0) {
                html += `
                    <div class="result-section">
                        <h2 class="section-title">📄 MSDS安全数据表</h2>
                        <div style="margin-bottom: 15px;">
                            ${data.msds[0].编制单位 ? `<span class="badge badge-info">编制单位: ${data.msds[0].编制单位}</span>` : ''}
                            ${data.msds[0].编制依据 ? `<span class="badge badge-info">依据: ${data.msds[0].编制依据}</span>` : ''}
                            ${data.msds[0].编制日期 ? `<span class="badge badge-info">日期: ${data.msds[0].编制日期}</span>` : ''}
                        </div>
                        ${renderMSDS(data.msds)}
                    </div>
                `;
            }

            container.innerHTML = html || '<div class="error-message">未查询到数据</div>';
        }

        // 渲染SOP
        function renderSOP(sopList) {
            let html = '';
            sopList.forEach(sop => {
                html += `
                    <div class="info-item" style="margin-bottom: 15px;">
                        <div class="info-label">${sop.规程名称} - ${sop.适用范围}</div>
                        <div class="info-value">${sop.步骤序号 ? `步骤${sop.步骤序号}: ` : ''}${sop.步骤内容 || sop.规程内容 || '-'}</div>
                    </div>
                `;
            });
            return html;
        }

        // 渲染GHS
        function renderGHS(ghsList) {
            return ghsList.map(ghs => `
                <div class="info-item">
                    <div class="info-label">${ghs.危害类别}</div>
                    <div class="info-value">
                        <span class="badge badge-danger">${ghs.信号词 || '-'}</span>
                        ${ghs.类别编号 || '-'}
                        ${ghs.H代码 ? `<br>H代码: ${ghs.H代码}` : ''}
                        ${ghs.P代码 ? `<br>P代码: ${ghs.P代码}` : ''}
                    </div>
                </div>
            `).join('');
        }

        // 渲染运输
        function renderTransport(transportList) {
            return transportList.map(t => `
                <div class="info-item">
                    <div class="info-label">UN${t.UN编号} - ${t.UN正式名称 || '-'}</div>
                    <div class="info-value">
                        危险类别: ${t.危险类别} | 包装类别: ${t.包装类别 || '-'}
                        ${t.是否海洋污染物 === '是' ? '<br><span class="badge badge-warning">海洋污染物</span>' : ''}
                    </div>
                </div>
            `).join('');
        }

        // 渲染应急措施
        function renderEmergency(emergencyList) {
            return emergencyList.map(e => `
                <div class="info-item">
                    <div class="info-label">${e.应急类型}</div>
                    <div class="info-value">${e.应急措施内容 || '-'}</div>
                </div>
            `).join('');
        }

        // 渲染MSDS章节
        function renderMSDS(msdsList) {
            let html = '<div class="msds-container">';
            
            // 按章节序号排序
            const sortedMsds = msdsList.sort((a, b) => a.章节序号 - b.章节序号);
            
            sortedMsds.forEach(chapter => {
                html += `
                    <div class="msds-chapter" style="margin-bottom: 25px; border-left: 4px solid #667eea; padding-left: 20px;">
                        <h3 style="color: #667eea; font-size: 1.2em; margin-bottom: 10px;">
                            ${chapter.章节序号}. ${chapter.章节标题}
                        </h3>
                        <div style="background: #f9fafb; padding: 15px; border-radius: 8px; white-space: pre-wrap; line-height: 1.8;">
                            ${chapter.内容 ? chapter.内容.substring(0, 2000) + (chapter.内容.length > 2000 ? '...' : '') : '暂无数据'}
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            return html;
        }

        // 显示分类查询结果
        function displayCategoryResults(data, category, chemicalName) {
            const container = document.getElementById('resultsContainer');
            
            const categoryNames = {
                'MANAGEMENT': '📜 管理要求',
                'USE_SOP': '⚠️ 使用要求',
                'IDENTIFICATION_PERMIT': '🔶 识别与许可',
                'EMERGENCY': '🚨 应急措施'
            };

            let html = `
                <div style="margin-bottom: 20px;">
                    <button class="btn btn-guide" onclick="backToFullView('${chemicalName}')">
                        ← 返回完整视图
                    </button>
                </div>
                <div class="result-section">
                    <h2 class="section-title">${categoryNames[category]}</h2>
            `;

            if (data.length === 0) {
                html += '<p>暂无数据</p>';
            } else {
                html += '<table class="data-table"><thead><tr>';
                
                // 表头
                const keys = Object.keys(data[0]);
                keys.forEach(key => {
                    html += `<th>${key}</th>`;
                });
                html += '</tr></thead><tbody>';

                // 数据行
                data.forEach(row => {
                    html += '<tr>';
                    keys.forEach(key => {
                        html += `<td>${row[key] || '-'}</td>`;
                    });
                    html += '</tr>';
                });

                html += '</tbody></table>';
            }

            html += '</div>';
            container.innerHTML = html;
        }
    </script>
</body>
</html>
